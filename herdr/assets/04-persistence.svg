<text x="441.0" y="323.64" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Old processes end</text>
<text x="429.8333333333333" y="352.24" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">saved layout returns</text>
<polyline points="535,385 535,425" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="529.7804135906653,414.1946347717679 535,425 540.2195864093347,414.1946347717679" fill="none" stroke="#64748b" stroke-width="2"/>
