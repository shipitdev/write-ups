<text x="73.83333333333333" y="337.94" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Restart server</text>
<polyline points="260,330 325,330" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="314.1946347717679,335.21958640933474 325,330 314.1946347717679,324.78041359066526" fill="none" stroke="#64748b" stroke-width="2"/>
