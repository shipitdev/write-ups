<text x="420.1666666666667" y="461.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Eligible agent sessions</text>
<text x="339.16666666666663" y="489.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">resume through supported integration</text>
<text x="45" y="490.24" font-family="Comic Sans MS, cursive" font-size="22" fill="#b45309">Recovery is not</text>
<text x="45" y="518.84" font-family="Comic Sans MS, cursive" font-size="22" fill="#b45309">process survival</text>
<text x="35" y="579.72" font-family="Comic Sans MS, cursive" font-size="16" fill="#64748b">HERDR / ARCHITECTURE NOTES     •     Conceptual illustration</text>
