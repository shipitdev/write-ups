<rect x="325" y="145" width="420" height="90" rx="10" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="442.3333333333333" y="183.64000000000001" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Server stays alive</text>
<text x="409.0" y="212.24" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">same processes continue</text>
