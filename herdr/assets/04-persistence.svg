<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#fffdf7"/>
<rect x="0" y="0" width="800" height="600" rx="10" fill="#fffdf7" stroke="#fffdf7" stroke-width="2"/>
<text x="35" y="57.44" font-family="Comic Sans MS, cursive" font-size="32" fill="#243342">Detach and restart are different promises.</text>
<text x="35" y="94.56" font-family="Comic Sans MS, cursive" font-size="18" fill="#64748b">Keep a live process, or reconstruct a saved session.</text>
<rect x="40" y="150" width="220" height="80" rx="10" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
