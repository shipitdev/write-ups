<text x="467.6666666666667" y="311.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Activity gate</text>
<text x="421.0" y="339.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">new working / blocked</text>
<polyline points="535,360 535,415" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="529.7804135906653,404.1946347717679 535,415 540.2195864093347,404.1946347717679" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="320" y="415" width="430" height="85" rx="10" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="438.8333333333333" y="451.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Settled-state wait</text>
<text x="428.0" y="479.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">idle / done / blocked</text>
<text x="45" y="318.24" font-family="Comic Sans MS, cursive" font-size="22" fill="#243342">No activity?</text>
<text x="45" y="346.84000000000003" font-family="Comic Sans MS, cursive" font-size="22" fill="#243342">prompt stalled</text>
<text x="45" y="445.24" font-family="Comic Sans MS, cursive" font-size="22" fill="#243342">Target changed?</text>
<text x="45" y="473.84000000000003" font-family="Comic Sans MS, cursive" font-size="22" fill="#243342">stop the wait</text>
<text x="45" y="540.48" font-family="Comic Sans MS, cursive" font-size="19" fill="#243342">Already working: the active turn can satisfy settlement.</text>
<text x="35" y="579.72" font-family="Comic Sans MS, cursive" font-size="16" fill="#243342">HERDR / SOURCE WALKTHROUGH     •     Simplified traced paths</text>
