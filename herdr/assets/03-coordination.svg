<text x="56.83333333333333" y="204.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">validate live agent</text>
<polyline points="260,183 320,183" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="309.1946347717679,188.21958640933477 320,183 309.1946347717679,177.78041359066523" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="320" y="140" width="430" height="85" rx="10" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="423.0" y="176.14000000000001" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Queue one submission</text>
<text x="428.3333333333333" y="204.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">text + delayed Enter</text>
<polyline points="535,225 535,275" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="529.7804135906653,264.1946347717679 535,275 540.2195864093347,264.1946347717679" fill="none" stroke="#64748b" stroke-width="2"/>
