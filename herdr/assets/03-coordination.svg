<text x="35" y="55.6" font-family="Comic Sans MS, cursive" font-size="30" fill="#243342">A prompt needs three separate checks.</text>
<text x="35" y="96.56" font-family="Comic Sans MS, cursive" font-size="18" fill="#243342">Submission, observed activity, then lifecycle settlement.</text>
