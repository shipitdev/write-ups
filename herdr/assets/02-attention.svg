<text x="110.5" y="401.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">working</text>
<text x="69.5" y="429.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">actively running</text>
<rect x="290" y="370" width="220" height="75" rx="10" fill="#ffd8a8" stroke="#334155" stroke-width="2"/>
<text x="360.5" y="401.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">blocked</text>
<text x="316.5" y="429.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">needs a decision</text>
<rect x="540" y="370" width="220" height="75" rx="10" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="594.8333333333334" y="401.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">done / idle</text>
<text x="571.6666666666666" y="429.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">ready for input</text>
<text x="45" y="506.16" font-family="Comic Sans MS, cursive" font-size="23" fill="#243342">unknown = cannot classify confidently</text>
<text x="45" y="538.56" font-family="Comic Sans MS, cursive" font-size="18" fill="#64748b">Lifecycle state tells you where to look, not whether code is correct.</text>
<text x="35" y="579.72" font-family="Comic Sans MS, cursive" font-size="16" fill="#64748b">HERDR / ARCHITECTURE NOTES     •     Conceptual illustration</text>
