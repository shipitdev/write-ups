<text x="35" y="57.44" font-family="Comic Sans MS, cursive" font-size="32" fill="#243342">A terminal full of text needs a status.</text>
<text x="35" y="94.56" font-family="Comic Sans MS, cursive" font-size="18" fill="#64748b">Herdr reads screen rules, or uses agent-reported lifecycle state.</text>
