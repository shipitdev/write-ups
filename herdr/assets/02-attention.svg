<text x="98.83333333333334" y="209.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">+ live screen</text>
<rect x="40" y="270" width="245" height="85" rx="10" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="62.33333333333333" y="306.14" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Agent / integration</text>
<text x="93.0" y="334.74" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">state reports</text>
