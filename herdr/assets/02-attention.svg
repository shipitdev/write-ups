<polyline points="285,310 370,258" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="363.506531613213,268.0913263900142 370,258 358.05878780699067,259.18636055292" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="370" y="205" width="365" height="90" rx="10" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="434.0" y="243.64000000000001" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">Lifecycle classification</text>
<text x="438.6666666666667" y="272.24" font-family="Comic Sans MS, cursive" font-size="22" fill="#334155">source authority rules</text>
<polyline points="550,295 550,340" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="544.7804135906653,329.1946347717679 550,340 555.2195864093347,329.1946347717679" fill="none" stroke="#64748b" stroke-width="2"/>
